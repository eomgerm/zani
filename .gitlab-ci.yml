stages:
  - architecture

architecture_maps:
  stage: architecture
  image: node:22-alpine
  script:
    - node scripts/generate-architecture-maps.cjs
  artifacts:
    name: "architecture-maps-$CI_COMMIT_SHORT_SHA"
    paths:
      - public/
    expire_in: 30 days

pages:
  stage: architecture
  image: node:22-alpine
  script:
    - node scripts/generate-architecture-maps.cjs
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
