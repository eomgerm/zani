[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zani-ai"
version = "0.1.0"
description = "AI components for the ZANI learning reaction analysis service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
vision = [
    "mediapipe>=0.10.35,<0.11",
    "numpy>=2.0,<3",
]
train = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "onnxscript>=0.5,<1",
    "scikit-learn>=1.7,<2",
    "torch>=2.7,<3",
]
eda = [
    "opencv-contrib-python>=4.13,<5",
    "openpyxl>=3.1,<4",
    "pandas>=3,<4",
    "plotly>=6,<7",
    "torch>=2.7,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/zani_ai"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=zani_ai --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["zani_ai"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "mediapipe",
    "mediapipe.*",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
