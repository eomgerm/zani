plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'com.a105'
version = '0.0.1-SNAPSHOT'
description = 'ZANI-BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

spotless {
    java {
        targetExclude(
            'build/generated/**/*.java',
            'src/generated/**/*.java',
            'src/main/generated/**/*.java',
            'src/test/generated/**/*.java',
            '.apt_generated/**/*.java',
            '.apt_generated_tests/**/*.java'
        )
        palantirJavaFormat('2.96.0').formatJavadoc(true)
        importOrder('java|javax|jakarta', '', 'com.a105', '\\#')
        formatAnnotations()
        forbidWildcardImports()
    }
}

ext {
    set('springCloudVersion', "2025.1.2")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.hypersistence:hypersistence-tsid:2.1.4'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation('io.swagger.parser.v3:swagger-parser:2.1.27') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-core'
        exclude group: 'io.swagger.core.v3', module: 'swagger-models'
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    testImplementation('com.atlassian.oai:swagger-request-validator-mockmvc:2.44.9') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-core'
        exclude group: 'io.swagger.core.v3', module: 'swagger-models'
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// 코드-퍼스트 OpenAPI: 애노테이션된 코드에서 앱을 부팅해 /v3/api-docs.yaml 을 받아
// contracts/openapi/zani.yaml 로 생성한다. 이 파일은 손으로 편집하지 않는다(생성물).
// 부팅에는 local 프로파일 기준 MySQL/Redis 가 필요하다(기존 @SpringBootTest 와 동일 전제).
openApi {
    apiDocsUrl = 'http://localhost:8080/v3/api-docs.yaml'
    outputDir = file("$projectDir/src/main/resources/contracts/openapi")
    outputFileName = 'zani.yaml'
    waitTimeInSeconds = 90
}
