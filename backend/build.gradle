plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
}

group = 'com.a105'
version = '0.0.1-SNAPSHOT'
description = 'ZANI-BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

spotless {
    java {
        targetExclude(
            'build/generated/**/*.java',
            'src/generated/**/*.java',
            'src/main/generated/**/*.java',
            'src/test/generated/**/*.java',
            '.apt_generated/**/*.java',
            '.apt_generated_tests/**/*.java'
        )
        palantirJavaFormat('2.96.0').formatJavadoc(true)
        importOrder('java|javax|jakarta', '', 'com.a105', '\\#')
        formatAnnotations()
        forbidWildcardImports()
    }
}

ext {
    set('springCloudVersion', "2025.1.2")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // 리포트 준비 후 학생에게 보내는 알림 이메일 발송(notification). JavaMailSender 는 spring.mail.host 가 있을 때만 만들어진다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Egress가 강사 오디오를 raw PCM으로 밀어 넣는 내부 WebSocket 수신용.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.hypersistence:hypersistence-tsid:2.1.4'
    // 전사 클립을 MP3로 인코딩한다. LAME 의 순수 Java 포트라 네이티브 라이브러리나 ffmpeg 바이너리를
    // 런타임 이미지에 넣지 않아도 된다.
    implementation 'de.sciss:jump3r:1.0.5'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation('io.swagger.parser.v3:swagger-parser:2.1.27') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-core'
        exclude group: 'io.swagger.core.v3', module: 'swagger-models'
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    testImplementation('com.atlassian.oai:swagger-request-validator-mockmvc:2.44.9') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-core'
        exclude group: 'io.swagger.core.v3', module: 'swagger-models'
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'io.livekit:livekit-server:0.14.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
