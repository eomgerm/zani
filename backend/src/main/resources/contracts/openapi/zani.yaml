openapi: 3.0.3
info:
  title: ZANI API
  description: Google 로그인, 세션(강의방) 생성·입장·목록 조회 계약
  version: "1.0.0"
servers:
  - url: /api/v1

paths:
  /auth/login/google:
    post:
      operationId: loginWithGoogle
      summary: Google 계정으로 로그인
      description: |
        프론트에서 Google Identity Services로 발급받은 ID Token을 검증하고,
        최초 로그인이면 회원을 생성한 뒤 자체 access/refresh 토큰을 발급한다.
        refresh 토큰은 응답 바디가 아닌 HttpOnly 쿠키(auth/refresh 경로)로 내려간다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLoginApiResponse"
        "400":
          description: 요청 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Google ID Token이 유효하지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                isSuccess: false
                code: AUTH_008
                message: Google ID token is invalid

  /sessions:
    post:
      operationId: createSession
      summary: 세션(강의방) 생성
      description: |
        진행 중인 방이 없는 강사가 제목과 함께 세션을 생성한다.
        LIVE 상태로 즉시 시작되며, 고유 초대 코드가 함께 발급된다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: 세션 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 이미 진행 중인 세션이 있음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                isSuccess: false
                code: SESSION_APP_001
                message: An active session already exists

    get:
      operationId: listSessions
      summary: 내가 참여 중인 세션 목록 조회
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 세션 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/join:
    post:
      operationId: joinSession
      summary: 초대 코드로 세션 입장
      description: |
        유효한 초대 코드로 입장하면 STUDENT 멤버십을 즉시 얻는다.
        이미 참여 중인 세션이면 멱등하게 기존 멤버십을 반환한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSessionRequest"
      responses:
        "200":
          description: 세션 입장 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSessionApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 유효하지 않은 초대 코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                isSuccess: false
                code: SESSION_APP_005
                message: No session found for the given invite code

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 인증되지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
          example:
            isSuccess: false
            code: COMM_401
            message: Authentication is required

  schemas:
    GoogleLoginRequest:
      type: object
      properties:
        idToken:
          type: string
      required:
        - idToken

    GoogleLoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        email:
          type: string
        displayName:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        newMember:
          type: boolean

    GoogleLoginApiResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        data:
          $ref: "#/components/schemas/GoogleLoginResponse"
      required:
        - isSuccess

    SessionStatus:
      type: string
      enum:
        - LIVE
        - ENDED

    SessionRole:
      type: string
      enum:
        - INSTRUCTOR
        - STUDENT

    # 공통 응답 봉투. data 형태가 없는 에러 응답 등 범용으로 쓴다.
    ApiResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        data:
          nullable: true
      required:
        - isSuccess

    CreateSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
      required:
        - title

    CreateSessionResponse:
      type: object
      properties:
        sessionId:
          # TSID 는 JavaScript 안전 정수 상한(2^53-1)을 넘어 브라우저에서 값이 반올림된다.
          # 그래서 식별자는 문자열로 내보낸다.
          type: string
        inviteCode:
          type: string
          minLength: 8
          maxLength: 8
        status:
          $ref: "#/components/schemas/SessionStatus"
        role:
          $ref: "#/components/schemas/SessionRole"
        expiresAt:
          type: string
          format: date-time

    CreateSessionApiResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        data:
          $ref: "#/components/schemas/CreateSessionResponse"
      required:
        - isSuccess

    JoinSessionRequest:
      type: object
      properties:
        inviteCode:
          type: string
          minLength: 8
          maxLength: 8
      required:
        - inviteCode

    JoinSessionResponse:
      type: object
      properties:
        sessionId:
          # TSID 는 JavaScript 안전 정수 상한(2^53-1)을 넘어 브라우저에서 값이 반올림된다.
          # 그래서 식별자는 문자열로 내보낸다.
          type: string
        inviteCode:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        role:
          $ref: "#/components/schemas/SessionRole"

    JoinSessionApiResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        data:
          $ref: "#/components/schemas/JoinSessionResponse"
      required:
        - isSuccess

    SessionSummary:
      type: object
      properties:
        sessionId:
          # TSID 는 JavaScript 안전 정수 상한(2^53-1)을 넘어 브라우저에서 값이 반올림된다.
          # 그래서 식별자는 문자열로 내보낸다.
          type: string
        inviteCode:
          type: string
        title:
          type: string
        instructorName:
          # 학생 카드가 "누구 수업인지" 를 보여주는 데 쓴다.
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        role:
          $ref: "#/components/schemas/SessionRole"
        startedAt:
          type: string
          format: date-time
        endedAt:
          # 진행 중인 수업에는 종료 시각이 없다.
          type: string
          format: date-time
          nullable: true
        participantCount:
          # 들어온 적 있는 사람 수다. 지금 접속 중인 인원이 아니다 — 참가자 행은 퇴장해도 남는다.
          type: integer
          format: int64
        reportStatus:
          $ref: "#/components/schemas/SessionReportStatus"
        rejoinable:
          # 진행 중이면서 내 참가자 행이 있을 때만 true. 프리조인을 다시 거치지 않고 강의실로 들어갈 수 있다.
          type: boolean

    SessionReportStatus:
      # pipeline_jobs 의 여섯 단계를 화면이 구분해야 하는 셋으로 접은 값이다.
      # 중간 단계를 그대로 노출하면 화면이 파이프라인 구현에 묶여, 단계가 늘 때마다 FE 도 고쳐야 한다.
      type: string
      enum:
        - NONE
        - PROCESSING
        - COMPLETED
        - FAILED

    SessionListApiResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
      required:
        - isSuccess
