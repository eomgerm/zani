spring:
  application:
    name: ZANI-BE
  profiles:
    default: local
  task:
    scheduling:
      # 기본값 1이면 @Scheduled 작업들이 스레드 하나를 공유한다. 녹화 outbox 릴레이는 한 번에 최대 20건을
      # 처리하고 건마다 LiveKit 호출이 최대 60초 매달릴 수 있어, 100ms 주기인 강사 오디오 무음 패딩이
      # 그동안 굶는다. 현재 스케줄 작업은 3개(무음 패딩·outbox 릴레이·세션 만료)라 여유 1개를 더 둔다.
      pool:
        size: 4
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  issuer: ZANI
  access-token-expiration: 1h
  refresh-token-expiration: 30d

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

auth:
  cookie:
    refresh-token-name: refresh_token
    # /refresh 뿐 아니라 /logout 에도 쿠키가 실려야 하므로 auth 하위 전체로 스코프한다.
    refresh-token-path: /api/v1/auth

springdoc:
  swagger-ui:
    path: /swagger-ui.html

session:
  # 최대 수업 시간(3시간) 초과 세션을 정리하는 주기(ISO-8601 duration).
  expiry-sweep-delay: ${SESSION_EXPIRY_SWEEP_DELAY:PT1M}

gms:
  base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com}
  api-key: ${GMS_API_KEY:}
  mock-enabled: ${GMS_MOCK_ENABLED:true}
  read-timeout: ${GMS_READ_TIMEOUT:10s}
  connect-timeout: ${GMS_CONNECT_TIMEOUT:2s}

attention:
  detector:
    # 서버가 해석할 수 있는 검출기 계약. 배포 계약은 확정 문서 §3.1 의 mediapipe_98_v1 이다.
    # 비워 두면 버전을 따지지 않는다(로컬·시연 편의).
    supported-feature-schema-versions:
      - mediapipe_98_v1
    supported-engine-versions: []

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  environment: ${LIVEKIT_ENVIRONMENT:local}
  token-ttl: ${LIVEKIT_TOKEN_TTL:PT10M}

audio-clip:
  # 강사 마이크 링버퍼가 유지하는 최근 구간. 서버 메모리에만 두고 저장하지 않는다.
  window: ${AUDIO_CLIP_WINDOW:PT5M}
  # 이보다 짧게 확보됐으면 전사를 시도하지 않는다(수업 시작 직후 등).
  min-transcribable: ${AUDIO_CLIP_MIN_TRANSCRIBABLE:PT1M}
  # Egress WebSocket 출력의 샘플레이트(s16le 모노). LiveKit은 들어오는 트랙을 따르며 보통 48kHz다.
  sample-rate: ${AUDIO_CLIP_SAMPLE_RATE:48000}
  # 버퍼를 동시에 들 수 있는 세션 수. 상한이 없으면 OOM으로 진행 중인 모든 강의가 끊긴다.
  max-sessions: ${AUDIO_CLIP_MAX_SESSIONS:8}
  # Egress가 오디오를 밀어 넣을 주소. Egress가 host 네트워크라 기본값(루프백)으로 도달한다.
  # 접속 자격은 서버가 기동 시 만들어 덧붙이므로 설정할 값이 없다.
  stream-url-template: ${AUDIO_CLIP_STREAM_URL_TEMPLATE:ws://127.0.0.1:18080/internal/audio/{sessionId}}

recording:
  # Egress 노드(EC2)의 로컬 저장 루트. S3는 사용하지 않는다(가이드 §14).
  base-path: ${RECORDING_BASE_PATH:/srv/zani/recordings}
  # outbox 릴레이 주기(ISO-8601 duration).
  outbox-relay-delay: ${RECORDING_OUTBOX_RELAY_DELAY:PT5S}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/zani}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  secret: ${LOCAL_JWT_SECRET:zani-local-jwt-secret-key-must-be-at-least-thirty-two-bytes}

auth:
  cookie:
    secure: false
    same-site: Lax

cors:
  allowed-origins:
    - ${LOCAL_FRONTEND_ORIGIN:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:None}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}

gms:
  mock-enabled: ${GMS_MOCK_ENABLED:false}
