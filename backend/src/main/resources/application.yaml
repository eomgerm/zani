spring:
  application:
    name: ZANI-BE
  profiles:
    default: local
  task:
    scheduling:
      # 기본값 1이면 @Scheduled 작업들이 스레드 하나를 공유한다. 녹화 outbox 릴레이는 한 번에 최대 20건을
      # 처리하고 건마다 LiveKit 호출이 최대 60초 매달릴 수 있어, 100ms 주기인 강사 오디오 무음 패딩이
      # 그동안 굶는다. 스케줄 작업은 무음 패딩·outbox 릴레이·코칭 이력 재시도·세션 만료·메모 비활성 확정에
      # 더해, notification.email.enabled=true 일 때 알림 이메일 릴레이가 붙어 최대 6개다. 여유 1개를 더 둔다.
      pool:
        size: 7
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false

server:
  shutdown: graceful
  compression:
    # 참여도 타임라인 응답이 3시간 세션에서 2,160 포인트 × 9 필드라 압축 전 400KB 대가 된다.
    enabled: true
    mime-types: application/json
    # 작은 응답은 압축이 손해다. 큰 시계열 응답만 대상이 되게 충분히 높은 값을 둔다.
    min-response-size: 4KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  issuer: ZANI
  access-token-expiration: 1h
  refresh-token-expiration: 30d

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

auth:
  cookie:
    refresh-token-name: refresh_token
    # /refresh 뿐 아니라 /logout 에도 쿠키가 실려야 하므로 auth 하위 전체로 스코프한다.
    refresh-token-path: /api/v1/auth

springdoc:
  swagger-ui:
    path: /swagger-ui.html

session:
  # 최대 수업 시간(3시간) 초과 세션을 정리하는 주기(ISO-8601 duration).
  expiry-sweep-delay: ${SESSION_EXPIRY_SWEEP_DELAY:PT1M}

postclass:
  # 30분 넘게 입력이 없는 강사 메모를 확정하는 주기(ISO-8601 duration).
  # 비활성 기준 30분 자체는 도메인 규칙(InstructorNote.INACTIVITY_WINDOW)이라 설정으로 열지 않는다.
  note-inactivity-sweep-delay: ${POSTCLASS_NOTE_INACTIVITY_SWEEP_DELAY:PT1M}
  transcription:
    # 사후 전사가 Track Egress 원본 OGG 를 읽을 루트. recording.base-path 와 값이 같아도 뜻이 다르다 —
    # 그쪽은 "LiveKit 에 넘길 Egress 출력 경로"이고 이쪽은 "우리가 읽을 마운트 경로"다. 겸용하면 두
    # 마운트가 갈리는 날 조용히 깨진다. 파일 경로의 정본은 DB recording_files.storage_key 이고, 이 루트는
    # 그 상대 경로의 기준점일 뿐이다 — 디렉터리를 나열하지 않는다(마운트에 o+r 이 없어 나열도 안 된다).
    source-root: ${POSTCLASS_SOURCE_ROOT:/srv/zani/recordings/track-egress}
    # 청크를 만들 작업 디렉터리. 원본 마운트는 read-only 라 산출물은 반드시 여기에 쓴다.
    # 트랙 하나를 분할·처리·정리한 뒤 다음 트랙으로 넘어가므로 피크는 트랙 하나 크기(3시간이면 약 170MB)다.
    # 모든 종료 경로에서 삭제한다.
    work-dir: ${POSTCLASS_WORK_DIR:/tmp/zani-postclass}
    # ffmpeg 는 OGG stream-copy 분할에, ffprobe 는 산출물 검증에 쓴다. 재인코딩은 하지 않는다.
    # 이미지에 없으면 Dockerfile 빌드가 실패하므로 여기서는 경로만 연다(PATH 기준).
    ffmpeg-path: ${POSTCLASS_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${POSTCLASS_FFPROBE_PATH:ffprobe}
    # 외부 프로세스 1회 상한. 초과하면 강제 종료한다. stream copy 는 I/O 뿐이라 3시간 트랙도 초 단위로
    # 끝나지만, 멈춘 프로세스가 오케스트레이션 스레드를 잡는 것을 막는 안전장치다.
    process-timeout: ${POSTCLASS_FFMPEG_TIMEOUT:PT60S}
    # 전사 대기 작업을 훑는 주기. 스케줄 스레드는 디스패치만 하고 즉시 반환하므로 짧게 둘 수 있다.
    poll-delay: ${POSTCLASS_TRANSCRIPTION_POLL_DELAY:PT10S}
    # 청크 목표 길이. 25 MiB 한도가 아니라 힙(요청 버퍼링)과 timeout 예측 가능성 때문에 이 값이다.
    # 실측 비트레이트(104.8~127 kbps)로 10분이면 7.9~9.5 MB 라 한도에 여유가 크다. 짧게 쪼개면 호출당
    # 고정 오버헤드가 곱해진다 — 2분 청크의 처리시간/길이 비율이 5분 파일의 약 2배였다(실측).
    chunk-duration: ${POSTCLASS_CHUNK_DURATION:PT10M}
    # 청크 선점의 유효 기간. 지나면 선점한 실행이 죽은 것으로 보고 다른 실행이 회수한다.
    # gms.postclass-transcribe-timeout(180초)보다 넉넉해야 한다 — 호출이 상한까지 걸린 뒤 결과를
    # 기록할 여유가 없으면, 살아 있는 작업의 청크를 다른 실행이 가져가고 원래 작업의 쓰기는 fencing 에
    # 걸려 버려진다. 그러면 같은 청크를 두 번 호출한다. 180초 + 기록 여유로 5분을 둔다.
    lease-duration: ${POSTCLASS_TRANSCRIPTION_LEASE_DURATION:PT5M}
    # 실질 업로드 상한. GMS 멀티파트 한도는 25 MiB(26,214,400 B) 실측이고 여유를 두어 24 MiB 로 잡는다.
    # 목표 시간으로 자른 뒤 산출물 크기를 확인해 이 값을 넘으면 그 청크만 반으로 다시 자른다 —
    # 파일 내부에서도 비트레이트가 변하므로 평균으로 역산한 시간만 믿을 수 없다.
    max-upload-bytes: ${POSTCLASS_MAX_UPLOAD_BYTES:25165824}
    # GMS 청크 호출 동시성. 오케스트레이션은 1개(세션 직렬)이고 이 값은 그 안의 업로드에만 적용된다.
    # 힙은 청크 크기 × 이 값보다 크다(byte[] 복사·multipart 조립). 올릴 때 peak heap 을 함께 본다.
    concurrency: ${POSTCLASS_TRANSCRIPTION_CONCURRENCY:2}
    # 무음 사전 판별. 기본 OFF 다(S15P11A105-292 로 분리). GMS 응답의 no_speech_prob 는 호출 후 값이라
    # 호출 수를 줄이지 못하고, 마이크 ON 상태의 침묵(-30.3 dB)은 발화(-24.0 dB)와 6 dB 차이라 음량만으로
    # 가릴 수 없다. 잘못 건너뛰어 발화를 잃는 것이 호출 낭비보다 나쁘다.
    silence-prefilter-enabled: ${POSTCLASS_SILENCE_PREFILTER_ENABLED:false}

notification:
  email:
    # 리포트가 준비된(session_reports.published_at 설정) 세션의 학생에게 이메일을 보내는 릴레이의 활성 여부.
    # 켤 때는 SMTP 를 함께 설정한다: SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME /
    # SPRING_MAIL_PASSWORD (relaxed binding). 이 값들이 없으면 JavaMailSender 빈이 없어 발송이 실패로 기록·재시도된다.
    # 꺼져 있으면 등록·발송 스케줄러 자체가 등록되지 않는다.
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    # 등록 + 발송 릴레이 주기(ISO-8601 duration).
    relay-delay: ${NOTIFICATION_EMAIL_RELAY_DELAY:PT10S}
    # 학생에게 보이는 발신 주소.
    from: ${NOTIFICATION_EMAIL_FROM:no-reply@zani.app}
    # 이메일 로그인 링크의 앱 기본 주소. 링크는 {app-base-url}/sessions/{sessionId}/report 로 만든다.
    app-base-url: ${NOTIFICATION_APP_BASE_URL:https://zani.app}

gms:
  base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com}
  api-key: ${GMS_API_KEY:}
  mock-enabled: ${GMS_MOCK_ENABLED:true}
  read-timeout: ${GMS_READ_TIMEOUT:10s}
  connect-timeout: ${GMS_CONNECT_TIMEOUT:2s}
  stt-model: ${GMS_STT_MODEL:whisper-1}
  # 전사 전용 timeout. 재시도는 없다.
  # 실측: 300초 클립이 GMS 부하에 따라 14~31초. 기준 문서 §9의 10초는 300초 클립에서 거의 항상
  # 실패해 20초로 올렸다. 다만 실측 최대치(31초)까지 기다리지는 않는다 — 느린 응답을 끊는 쪽이
  # 낫다고 봤다. 팁을 보내지 않으면 쿨타임이 시작되지 않아(§10 "알림 1회 후 10분") 다음 트리거가
  # 부하가 덜한 시점에 다시 시도할 수 있고, 300초 전 발화에 40초 지연을 더한 팁은 강사에게
  # 효용이 떨어진다. 운영 데이터가 쌓이면 팀에서 재조정한다.
  transcribe-timeout: ${GMS_TRANSCRIBE_TIMEOUT:20s}
  transcribe-language: ${GMS_TRANSCRIBE_LANGUAGE:ko}
  # 사후 배치 전사 전용 timeout. 위의 transcribe-timeout(20s) 을 재사용하면 안 된다 — 그 값은 실시간
  # 코칭용이고 "느린 응답을 끊는 쪽이 낫다" 는 판단이 들어 있다. 배치는 반대로 기다려야 한다.
  # 실측 최악 비율(처리시간/오디오길이 0.198)을 10분 청크에 적용하면 약 119초다. 10분은 미실측이라
  # 여유를 두어 180초로 시작하고, timeout 이 나도 S15P11A105-107 의 재시도 정책을 그대로 쓴다.
  postclass-transcribe-timeout: ${GMS_POSTCLASS_TRANSCRIBE_TIMEOUT:180s}
  tip-model: ${GMS_TIP_MODEL:gpt-5.4-mini}
  # 팁 문구 전용 timeout. 실측에서 슬롯 1개 응답이 1.2~1.5초였다(프롬프트 100토큰 기준).
  # 전사 뒤에 붙는 단계라 여유를 크게 둘 이유가 없다.
  tip-timeout: ${GMS_TIP_TIMEOUT:6s}

coach:
  history-retry-delay: ${COACH_HISTORY_RETRY_DELAY:PT5S}
  tip:
    # 이 값에 못 미치는 슬롯은 팁을 만들지 않는다. 실제 응답 분포를 보고 조정한다.
    min-confidence: ${COACH_TIP_MIN_CONFIDENCE:0.5}
    # gpt-5.4-mini 는 max_tokens 를 거부하고 max_completion_tokens 를 요구한다(실측).
    # 실측 소비는 근거 구절(evidence)까지 받으면 50 토큰이다(없으면 25). reasoning 토큰은 쓰지
    # 않았다. 60 으로 두면 여유가 10 토큰뿐이라 잘릴 위험이 있어 관측치의 두 배로 둔다.
    max-completion-tokens: ${COACH_TIP_MAX_COMPLETION_TOKENS:100}
    # 프롬프트에 넣을 전사 마지막 N자 — window 한 번 분량의 상한이다.
    # 실측: 5분 강의 전사가 1,665자(5.5자/초)였다. 말이 빠른 강사(8~9자/초)면 300초에
    # 2,400~2,700자가 나오므로 3,000자면 온전히 들어간다. 더 낮추면 빠른 강사만 window 가
    # 조용히 줄어든다. 이 상한이 필요한 이유는 지연이 아니라(입력 1,500자와 3,331자 모두
    # 1.25초로 같았다) 최근성이다 — 입력을 늘리면 모델이 트리거 직전이 아닌 앞부분 개념을 골랐다.
    transcript-tail-chars: ${COACH_TIP_TRANSCRIPT_TAIL_CHARS:3000}
  pipeline:
    # 한 건이 전사 20초 + LLM 6초로 최대 26초 스레드를 점유한다. 오디오 버퍼가 동시에 들 수 있는
    # 세션이 8개라 실행 2 + 대기 6 으로 상한을 맞춘다.
    thread-count: ${COACH_PIPELINE_THREAD_COUNT:2}
    queue-capacity: ${COACH_PIPELINE_QUEUE_CAPACITY:6}
    # 트리거 시각부터 작업 시작까지 허용하는 지연. 이보다 밀리면 전사·GMS 를 호출하지 않는다 —
    # 지금 오디오를 떠도 트리거 당시가 아닌 발화가 섞인다. 10초는 attention 판정 한 주기이고
    # 300초 창의 약 3.3% 다. 링버퍼가 끝점 지정 스냅샷을 제공하면 이 상한이 필요 없어진다.
    max-trigger-delay: ${COACH_PIPELINE_MAX_TRIGGER_DELAY:PT10S}

attention:
  detector:
    # 서버가 해석할 수 있는 특징 추출 계약. 배포 계약은 확정 문서 §3.1 의 mediapipe_98_v1 이다.
    # 비워 두면 버전을 따지지 않는다(로컬·시연 편의). 추론 엔진 버전은 받지 않는다 — 티켓 61.
    supported-feature-schema-versions:
      - mediapipe_98_v1
  timeline:
    # 리포트 타임라인 계산 임계값. 적지 않은 값은 TimelinePolicy.defaults() 를 쓴다.
    # FRD §18.3 흐트러짐 구간 임계값. 원격 조정이 가능해야 한다는 요구사항 때문에 설정으로 뺀다.
    distraction-start-ratio: ${ATTENTION_TIMELINE_DISTRACTION_START_RATIO:0.30}
    distraction-start-hold: ${ATTENTION_TIMELINE_DISTRACTION_START_HOLD:PT20S}
    distraction-end-ratio: ${ATTENTION_TIMELINE_DISTRACTION_END_RATIO:0.20}
    distraction-end-hold: ${ATTENTION_TIMELINE_DISTRACTION_END_HOLD:PT30S}
    distraction-merge-gap: ${ATTENTION_TIMELINE_DISTRACTION_MERGE_GAP:PT15S}
    # 확정 문서 §6.2 의 상태 키 TTL 과 같은 값이다. 사후 재생이 실시간과 같은 순간에 같은 판단을 하려면
    # 두 값이 함께 움직여야 한다.
    connection-gap: ${ATTENTION_TIMELINE_CONNECTION_GAP:PT30S}
    # 집중 흐름 칸 크기와 70% 게이트. 칸은 겹치지 않으며 이동창이 아니다(설계 문서 §2.8·§2.9).
    # 게이트가 빡빡해 실측에서 공백이 과하게 많으면 여기를 조정한다. connection-gap 과 값이 같지만
    # 뜻이 다르므로 함께 움직이지 않는다.
    focus-bucket: ${ATTENTION_TIMELINE_FOCUS_BUCKET:PT30S}
    focus-coverage-floor: ${ATTENTION_TIMELINE_FOCUS_COVERAGE_FLOOR:0.7}

coaching-trigger:
  # 최근 5분 유의 학생 비율의 하한. 이 값 이상이면 트리거한다(확정 문서 §7).
  threshold: ${COACHING_TRIGGER_THRESHOLD:0.30}
  # 트리거를 연 시각부터 다음 트리거를 막는 기간. 팁 유형과 무관한 단일 글로벌 쿨타임이다.
  cooldown: ${COACHING_TRIGGER_COOLDOWN:PT10M}
  # 확보된 강사 오디오가 이보다 짧으면 트리거하지 않는다. 이 경우에만 쿨타임을 시작하지 않는다.
  minimum-audio: ${COACHING_TRIGGER_MINIMUM_AUDIO:PT1M}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  environment: ${LIVEKIT_ENVIRONMENT:local}
  token-ttl: ${LIVEKIT_TOKEN_TTL:PT10M}

audio-clip:
  # 강사 마이크 링버퍼가 유지하는 최근 구간. 서버 메모리에만 두고 저장하지 않는다.
  window: ${AUDIO_CLIP_WINDOW:PT5M}
  # 이보다 짧게 확보됐으면 전사를 시도하지 않는다(수업 시작 직후 등).
  min-transcribable: ${AUDIO_CLIP_MIN_TRANSCRIBABLE:PT1M}
  # Egress WebSocket 출력의 샘플레이트(s16le 모노). LiveKit은 들어오는 트랙을 따르며 보통 48kHz다.
  sample-rate: ${AUDIO_CLIP_SAMPLE_RATE:48000}
  # 버퍼를 동시에 들 수 있는 세션 수. 상한이 없으면 OOM으로 진행 중인 모든 강의가 끊긴다.
  max-sessions: ${AUDIO_CLIP_MAX_SESSIONS:8}
  # Egress가 오디오를 밀어 넣을 주소. Egress가 host 네트워크라 기본값(루프백)으로 도달한다.
  # 접속 자격은 서버가 기동 시 만들어 덧붙이므로 설정할 값이 없다.
  stream-url-template: ${AUDIO_CLIP_STREAM_URL_TEMPLATE:ws://127.0.0.1:18080/internal/audio/{sessionId}}

recording:
  # Egress 노드(EC2)의 로컬 저장 루트. S3는 사용하지 않는다(가이드 §14).
  base-path: ${RECORDING_BASE_PATH:/srv/zani/recordings}
  # 운영에서는 항상 활성화한다. 수동 relay를 검증하는 통합 테스트만 false로 격리한다.
  outbox-relay-enabled: ${RECORDING_OUTBOX_RELAY_ENABLED:true}
  # outbox 릴레이 주기(ISO-8601 duration).
  outbox-relay-delay: ${RECORDING_OUTBOX_RELAY_DELAY:PT5S}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    # 시연용 목업 데이터(db/seed/R__demo_seed.sql)를 함께 적용한다. prod 는 붙이지 않는다.
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/zani}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  secret: ${LOCAL_JWT_SECRET:zani-local-jwt-secret-key-must-be-at-least-thirty-two-bytes}

auth:
  cookie:
    secure: false
    same-site: Lax

cors:
  allowed-origins:
    - ${LOCAL_FRONTEND_ORIGIN:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # 시연용 목업 데이터(db/seed/R__demo_seed.sql)를 함께 적용한다. prod 는 붙이지 않는다.
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:None}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}

gms:
  mock-enabled: ${GMS_MOCK_ENABLED:false}
