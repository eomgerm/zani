spring:
  application:
    name: ZANI-BE
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  issuer: ZANI
  access-token-expiration: 1h
  refresh-token-expiration: 30d

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

auth:
  cookie:
    refresh-token-name: refresh_token
    refresh-token-path: /api/v1/auth/refresh

springdoc:
  swagger-ui:
    path: /swagger-ui.html

session:
  # 최대 수업 시간(3시간) 초과 세션을 정리하는 주기(ISO-8601 duration).
  expiry-sweep-delay: ${SESSION_EXPIRY_SWEEP_DELAY:PT1M}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  environment: ${LIVEKIT_ENVIRONMENT:local}
  token-ttl: ${LIVEKIT_TOKEN_TTL:PT10M}

audio-clip:
  # 강사 마이크 링버퍼가 유지하는 최근 구간. 서버 메모리에만 두고 저장하지 않는다.
  window: ${AUDIO_CLIP_WINDOW:PT5M}
  # 이보다 짧게 확보됐으면 전사를 시도하지 않는다(수업 시작 직후 등).
  min-transcribable: ${AUDIO_CLIP_MIN_TRANSCRIBABLE:PT1M}
  # Egress WebSocket 출력의 샘플레이트(s16le 모노). LiveKit은 들어오는 트랙을 따르며 보통 48kHz다.
  sample-rate: ${AUDIO_CLIP_SAMPLE_RATE:48000}
  # Egress만 아는 공유 시크릿. 내부 수신 경로 인증에 쓰므로 로그·응답에 남기지 않는다.
  stream-secret: ${AUDIO_CLIP_STREAM_SECRET:}
  # Egress가 접속할 수신 주소. Egress 노드에서 도달 가능한 주소여야 한다.
  stream-url-template: ${AUDIO_CLIP_STREAM_URL_TEMPLATE:}

recording:
  # Egress 노드(EC2)의 로컬 저장 루트. S3는 사용하지 않는다(가이드 §14).
  base-path: ${RECORDING_BASE_PATH:/srv/zani/recordings}
  # outbox 릴레이 주기(ISO-8601 duration).
  outbox-relay-delay: ${RECORDING_OUTBOX_RELAY_DELAY:PT5S}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/zani}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  secret: ${LOCAL_JWT_SECRET:zani-local-jwt-secret-key-must-be-at-least-thirty-two-bytes}

auth:
  cookie:
    secure: false
    same-site: Lax

cors:
  allowed-origins:
    - ${LOCAL_FRONTEND_ORIGIN:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:None}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}
