spring:
  application:
    name: ZANI-BE
  profiles:
    default: local
  task:
    scheduling:
      # 기본값 1이면 @Scheduled 작업들이 스레드 하나를 공유한다. 녹화 outbox 릴레이는 한 번에 최대 20건을
      # 처리하고 건마다 LiveKit 호출이 최대 60초 매달릴 수 있어, 100ms 주기인 강사 오디오 무음 패딩이
      # 그동안 굶는다. 스케줄 작업은 무음 패딩·outbox 릴레이·코칭 이력 재시도·세션 만료·메모 비활성 확정에
      # 더해, notification.email.enabled=true 일 때 알림 이메일 릴레이가 붙어 최대 6개다. 여유 1개를 더 둔다.
      pool:
        size: 7
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false

server:
  shutdown: graceful
  compression:
    # 참여도 타임라인 응답이 3시간 세션에서 2,160 포인트 × 9 필드라 압축 전 400KB 대가 된다.
    enabled: true
    mime-types: application/json
    # 작은 응답은 압축이 손해다. 큰 시계열 응답만 대상이 되게 충분히 높은 값을 둔다.
    min-response-size: 4KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  issuer: ZANI
  access-token-expiration: 1h
  refresh-token-expiration: 30d

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

auth:
  cookie:
    refresh-token-name: refresh_token
    # /refresh 뿐 아니라 /logout 에도 쿠키가 실려야 하므로 auth 하위 전체로 스코프한다.
    refresh-token-path: /api/v1/auth

springdoc:
  swagger-ui:
    path: /swagger-ui.html

session:
  # 최대 수업 시간(3시간) 초과 세션을 정리하는 주기(ISO-8601 duration).
  expiry-sweep-delay: ${SESSION_EXPIRY_SWEEP_DELAY:PT1M}

postclass:
  # 30분 넘게 입력이 없는 강사 메모를 확정하는 주기(ISO-8601 duration).
  # 비활성 기준 30분 자체는 도메인 규칙(InstructorNote.INACTIVITY_WINDOW)이라 설정으로 열지 않는다.
  note-inactivity-sweep-delay: ${POSTCLASS_NOTE_INACTIVITY_SWEEP_DELAY:PT1M}
  student-analysis:
    # 학생 한 명분 출력 상한 — 요약 + 추천 5개 + 4지선다 5문항과 해설. 잘리면 finish_reason=length 로
    # JSON 이 깨져 그 학생의 응답 전체를 버린다. 실측 소비가 1,159~1,413 토큰이라 두 배 넘는 여유를 둔다.
    # 위의 content-analysis 와 값이 다른 이유는 산출물이 다르기 때문이다 — 그쪽은 구간 40개를 한 번에 낸다.
    # 요청 바이트 임계는 설정으로 열지 않는다 — 게이트웨이 실측 상한 102,400B 에서 나온 값이라 환경별로
    # 달라질 이유가 없고, 잘못 올리면 게이트웨이가 본문을 잘라 조용히 실패한다. 값과 근거는 코드에 있다.
    max-completion-tokens: ${POSTCLASS_ANALYSIS_MAX_COMPLETION_TOKENS:3000}
  content-analysis:
    # 수업 요약과 구간 목록(최대 40개, 구간마다 제목·요약)의 출력 상한. 잘리면 finish_reason=length 로
    # JSON 이 깨지고, 그것은 재시도할 수 없는 실패라 그 세션은 리포트를 영영 받지 못한다.
    #
    # 값은 스키마가 허용하는 최악을 덮는다: 구간 40개 × (제목 200자 + 요약 400자) + 전체 요약 1,500자에
    # JSON 구조를 더해 약 27,000자다. 한국어는 토큰당 1자 안팎이고 추론 토큰도 같은 예산을 쓰므로
    # 이전 상한(약 11,000자에 12,000토큰)과 같은 여유를 적용해 30,000 으로 둔다.
    # 예산을 크게 잡아도 실제 청구는 쓴 토큰만이므로, 잘리는 쪽이 훨씬 비싸다.
    # gpt-5.4-mini 같은 추론 모델은 reasoning 토큰도 이 예산에 함께 잡힌다.
    #
    # 구간 요약 상한이 200 에서 400 으로, 전체 요약이 1,000 에서 1,500 으로 늘어 12,000 에서 올렸다.
    # 두 상한은 GmsContentAnalysisHttpAdapter 의 상수이고 이 예산과 따로 움직일 수 없다 — 상한만 올리면
    # 최악에서 잘리고, 그것은 재시도할 수 없는 실패다.
    # 30,000 이 게이트웨이에 받아들여지는지는 미실측이다(가이드 §6 은 max_completion_tokens 자체만
    # 확인했고 상한값은 확인하지 않았다). GmsContentAnalysisLiveCheckTest 로 확인할 수 있다.
    # 요청 바이트 임계는 설정으로 열지 않는다 — 게이트웨이 실측 상한 102,400B 에서 나온 값이라 환경별로
    # 달라질 이유가 없고, 잘못 올리면 게이트웨이가 본문을 잘라 조용히 실패한다. 값과 근거는 코드에 있다.
    max-completion-tokens: ${POSTCLASS_CONTENT_ANALYSIS_MAX_COMPLETION_TOKENS:30000}
  instructor-analysis:
    # 종합 피드백 + 점수 4개 + 인사이트 4개(제목·근거·제안)가 들어갈 출력 상한. 잘리면
    # finish_reason=length 로 JSON 이 깨져 그 세션의 응답 전체를 버린다.
    # 요청 바이트 임계(92,160B)는 설정으로 열지 않는다 — 게이트웨이 실측 상한 102,400B 에서 나온 값이라
    # 환경별로 달라질 이유가 없고, 잘못 올리면 게이트웨이가 본문을 잘라 조용히 실패한다.
    max-completion-tokens: ${POSTCLASS_INSTRUCTOR_ANALYSIS_MAX_COMPLETION_TOKENS:3000}
  transcription:
    # 사후 전사가 Track Egress 원본 OGG 를 읽을 루트. recording.base-path 와 값이 같아도 뜻이 다르다 —
    # 그쪽은 "LiveKit 에 넘길 Egress 출력 경로"이고 이쪽은 "우리가 읽을 마운트 경로"다. 겸용하면 두
    # 마운트가 갈리는 날 조용히 깨진다. 파일 경로의 정본은 DB recording_files.storage_key 이고, 이 루트는
    # 그 상대 경로의 기준점일 뿐이다 — 디렉터리를 나열하지 않는다(마운트에 o+r 이 없어 나열도 안 된다).
    #
    # 기본값은 호스트 경로가 아니라 컨테이너 안의 마운트 지점(/out)이다. compose 가 호스트
    # /srv/zani/recordings/track-egress 를 여기에 붙인다. 호스트 경로를 기본값으로 두면 환경변수를
    # 빠뜨린 배포가 컨테이너에 없는 경로를 보며 조용히 파일을 못 찾는다.
    source-root: ${POSTCLASS_SOURCE_ROOT:/out}
    # 청크를 만들 작업 디렉터리. 원본 마운트는 read-only 라 산출물은 반드시 여기에 쓴다.
    # 트랙 하나를 분할·처리·정리한 뒤 다음 트랙으로 넘어가므로 피크는 트랙 하나 크기(3시간이면 약 170MB)다.
    # 모든 종료 경로에서 삭제한다.
    work-dir: ${POSTCLASS_WORK_DIR:/tmp/zani-postclass}
    # ffmpeg 는 OGG stream-copy 분할에, ffprobe 는 산출물 검증에 쓴다. 재인코딩은 하지 않는다.
    # 이미지에 없으면 Dockerfile 빌드가 실패하므로 여기서는 경로만 연다(PATH 기준).
    ffmpeg-path: ${POSTCLASS_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${POSTCLASS_FFPROBE_PATH:ffprobe}
    # 외부 프로세스 1회 상한. 초과하면 강제 종료한다. stream copy 는 I/O 뿐이라 3시간 트랙도 초 단위로
    # 끝나지만, 멈춘 프로세스가 오케스트레이션 스레드를 잡는 것을 막는 안전장치다.
    process-timeout: ${POSTCLASS_FFMPEG_TIMEOUT:PT60S}
    # 전사 대기 작업을 훑는 주기. 스케줄 스레드는 디스패치만 하고 즉시 반환하므로 짧게 둘 수 있다.
    poll-delay: ${POSTCLASS_TRANSCRIPTION_POLL_DELAY:PT10S}
    # 청크 목표 길이. 25 MiB 한도가 아니라 힙(요청 버퍼링)과 timeout 예측 가능성 때문에 이 값이다.
    # 실측 비트레이트(104.8~127 kbps)로 10분이면 7.9~9.5 MB 라 한도에 여유가 크다. 짧게 쪼개면 호출당
    # 고정 오버헤드가 곱해진다 — 2분 청크의 처리시간/길이 비율이 5분 파일의 약 2배였다(실측).
    chunk-duration: ${POSTCLASS_CHUNK_DURATION:PT10M}
    # 한 주기에 훑을 대기 작업 수. 오케스트레이션 실행기가 크기 1·큐 0 이라 실제로 시작되는 것은 하나뿐이고
    # 나머지는 제출이 거부돼 다음 주기로 넘어간다(거부는 실패가 아니다). 1 보다 크게 두는 이유는 앞선 세션이
    # 이미 다른 실행에 넘어간 경우 같은 주기에 다음 후보를 시도할 수 있게 하려는 것이다.
    dispatch-batch-size: ${POSTCLASS_DISPATCH_BATCH_SIZE:5}
    # 배경 디스패치 스위치. 테스트는 이 값을 끄고 유스케이스를 직접 부른다(S15P11A105-276 교훈).
    enabled: ${POSTCLASS_TRANSCRIPTION_ENABLED:true}
    # 청크 선점의 유효 기간. 지나면 선점한 실행이 죽은 것으로 보고 다른 실행이 회수한다.
    # gms.postclass-transcribe-timeout(180초)보다 넉넉해야 한다 — 호출이 상한까지 걸린 뒤 결과를
    # 기록할 여유가 없으면, 살아 있는 작업의 청크를 다른 실행이 가져가고 원래 작업의 쓰기는 fencing 에
    # 걸려 버려진다. 그러면 같은 청크를 두 번 호출한다. 180초 + 기록 여유로 5분을 둔다.
    lease-duration: ${POSTCLASS_TRANSCRIPTION_LEASE_DURATION:PT5M}
    # 실질 업로드 상한. GMS 멀티파트 한도는 25 MiB(26,214,400 B) 실측이고 여유를 두어 24 MiB 로 잡는다.
    #
    # 이 값은 업로드 직전 가드다 — 넘는 청크는 GMS 를 호출하지 않고 비재시도 실패로 끊는다. 크기 초과
    # 청크를 자동으로 반분하는 동작은 없다(S15P11A105-247 범위 밖). 실측 비트레이트(104.8~127 kbps)로
    # 10분이면 7.9~9.5 MB 라 한도에 세 배 넘는 여유가 있어, 걸린다면 chunk-duration 을 낮춰 대응한다.
    max-upload-bytes: ${POSTCLASS_MAX_UPLOAD_BYTES:25165824}
    # GMS 청크 호출 동시성. 오케스트레이션은 1개(세션 직렬)이고 이 값은 그 안의 업로드에만 적용된다.
    # 힙은 청크 크기 × 이 값보다 크다(byte[] 복사·multipart 조립). 올릴 때 peak heap 을 함께 본다.
    concurrency: ${POSTCLASS_TRANSCRIPTION_CONCURRENCY:2}
    # 무음 사전 판별. 기본 OFF 다(S15P11A105-292 로 분리). GMS 응답의 no_speech_prob 는 호출 후 값이라
    # 호출 수를 줄이지 못하고, 마이크 ON 상태의 침묵(-30.3 dB)은 발화(-24.0 dB)와 6 dB 차이라 음량만으로
    # 가릴 수 없다. 잘못 건너뛰어 발화를 잃는 것이 호출 낭비보다 나쁘다.
    silence-prefilter-enabled: ${POSTCLASS_SILENCE_PREFILTER_ENABLED:false}
    # 무음 환각 세그먼트 필터(S15P11A105-306). 위의 silence-prefilter 와 단계가 다르다 — 그쪽은 GMS 를
    # 호출하기 전에 무음 청크를 골라 호출 수를 줄이는 최적화이고, 이쪽은 호출 후 돌아온 세그먼트를 최종
    # 전사에서 빼는 것이다. 서로 대체하지 않는다.
    #
    # GMS 응답과 청크 체크포인트(result_document)는 건드리지 않고 transcripts.transcript_document 를
    # 조립할 때만 뺀다. 그래서 임곗값을 바꿀 때 GMS 재호출 없이 재조립만으로 결과가 달라지고, 끄면 다음
    # 조립부터 필터 이전 동작으로 돌아간다.
    # 기본 ON 이다(S15P11A105-340). 처음에는 0.8 로 켜서 내보냈다가 실제 강의를 지우는 것이
    # 확인돼 316 에서 되돌렸고, 저장된 32개 트랙을 다시 대조해 안전 여유가 있는 0.98 로 올린 뒤
    # 극단적인 무음 환각만 정리하는 보조 수단으로 다시 켰다. 아래 임곗값 주석에 근거를 적었다.
    hallucination-filter-enabled: ${POSTCLASS_TRANSCRIPTION_HALLUCINATION_FILTER_ENABLED:true}
    # 이 값 이상인 no_speech_prob 세그먼트를 뺀다. 범위 0.0~1.0, 벗어나면 기동하지 않는다.
    # 운영에서 즉시 되돌려야 하면 위 스위치를 false 로 둔다.
    #
    # ★ 이 값으로는 환각과 실제 발화를 가를 수 없다. 임곗값을 조정해 해결되는 문제가 아니다.
    #
    # no_speech_prob 는 세그먼트 값이 아니라 30초 디코딩 창의 값이다(같은 seek 을 공유하는 세그먼트는
    # 값이 전부 같다). 그래서 침묵이 많이 섞인 창에 걸친 실제 발화는 높은 값을 물려받고, 실제 발화와
    # 같은 창에 떨어진 환각은 낮은 값을 물려받는다. 값이 답하는 것은 "이 문장이 환각인가" 가 아니라
    # "이 30초가 대체로 조용했나" 다.
    #
    # 실측 분포가 겹친다(값 / 판정 / 내용):
    #   0.515  실제  Node.js 강의 연속 설명 6개
    #   0.622  환각  지금까지 재택 플러스였습니다
    #   0.698  실제  네, 해시테이블과 충돌 해결 사후 처리…
    #   0.745  실제  이 부분 한 번 더 설명해 드리겠습니다…
    #   0.790  환각  지금까지 재택 플러스였습니다 (3건)
    #   0.811  실제  네, 정리하겠습니다…
    #   0.864  실제  현재 저장된 데이터 수를 배열 크기로…
    #   0.895  환각  지금까지 재택 플러스였습니다
    #   0.906  환각  고맙습니다
    #   0.921  실제  좋은 해시함수는 입력된 키를… (2건)
    #   0.924  환각  고맙습니다
    #   0.953  환각  고맙습니다
    #   0.964  실제  을 반복하여 최단거리를 구합니다
    #   0.965  환각  지금까지 재택 플러스였습니다
    #
    # 0.8 로 켜 둔 상태에서 실제 세션(873057758561862391)의 강사 트랙 10개 중 4개가 삭제됐다 —
    # 핵심 설명과 마무리 정리 63초였다. 그래서 이 값은 0.98 로 올렸다. 저장된 32개 트랙에서 실제
    # 발화 최댓값은 0.921 이고 0.98 이상 9건은 전부 환각이었다. 별도 GMS 응답에서 관측된 0.964
    # 실제 발화도 0.98 미만이라 필터 후보가 되지 않는다. 아래 연속성 rescue 는 임곗값 이상이어도 앞뒤
    # 실제 발화와 이어지는 조각을 위한 별도 안전장치다. 따라서 반복 규칙이 놓친 완전 무음 구간의
    # 극단값만 정리하는 보조 수단으로 기본 ON 한다(S15P11A105-340).
    #
    # 환각 제거의 주 수단은 아래 반복 문구 규칙이다.
    no-speech-threshold: ${POSTCLASS_TRANSCRIPTION_NO_SPEECH_THRESHOLD:0.98}
    # 반복 문구 환각 필터(S15P11A105-316). 환각 제거의 주 수단이다.
    #
    # no_speech_prob 는 30초 디코딩 창의 값이라, 실제 발화와 같은 창에 떨어진 환각은 발화와 값이
    # 똑같아진다 — 실측에서 학생 질문과 환각 5건이 모두 0.1109 였다. avg_logprob·compression_ratio·
    # temperature 도 전부 창 단위라 어떤 조합으로도 그 둘을 가를 수 없고, 남는 신호가 텍스트뿐이다.
    #
    # 규칙: 정규화 후 20자 이하인 같은 문구가 연속 3회 이상 나오고, 그중 과반이 no_speech_prob 0.5
    # 이상이면 반복 전체를 뺀다. 과반이 아니면 첫 하나만 남긴다(강사가 실제로 반복했을 수 있다).
    #
    # 오제거 방어의 근거는 실측이다. ① 강사가 마이크를 바꾸며 대본을 두 번 낭독한 세션에서 "안녕하세요"가
    # 두 번 나왔지만 사이에 다른 문장이 있어 연속이 아니었다 — 재낭독은 걸리지 않는다. ② 강사가 같은
    # 52자 문장을 3회 연속 읽은 세션이 있었고 그것은 실제 발화였다 — 20자 조건이 지킨다.
    # ③ 정상 강의 5건에서 이 규칙의 발동은 0건이었다 — 무음 확률 필터가 4건을 지운 그 강사 트랙에서도
    # 하나도 건드리지 않았다. 텍스트를 보기 때문에 실제 발화와 섞이지 않는다.
    repeated-phrase-filter-enabled: ${POSTCLASS_TRANSCRIPTION_REPEATED_PHRASE_FILTER_ENABLED:true}
  analysis:
    # 전사와 접두사를 나눈다. 합치면 전사를 끄는 순간 분석까지 꺼지고 주기도 따로 조절할 수 없다.
    # 실행기는 전사와 공유한다(크기 1·큐 0) — 무거운 작업 둘이 같은 호스트에서 동시에 돌지 않게 한다.
    #
    # ANALYZING 작업을 훑는 주기. 전사와 같은 값이다.
    poll-delay: ${POSTCLASS_ANALYSIS_POLL_DELAY:PT10S}
    # 한 주기에 훑을 작업 수. 실행기가 크기 1·큐 0 이라 실제로 시작되는 것은 하나뿐이고, 나머지는 제출이
    # 거부돼 다음 주기로 넘어간다. 1 보다 크게 두는 이유는 앞선 세션이 이미 다른 실행에 넘어간 경우
    # (선점 실패) 같은 주기에 다음 후보를 시도할 수 있게 하려는 것이다.
    dispatch-batch-size: ${POSTCLASS_ANALYSIS_DISPATCH_BATCH_SIZE:5}
    # 분석 실행권의 유효 기간. pipeline_jobs 에는 ANALYZING 단계 하나뿐이라 next_attempt_at 을 임대
    # 만료 시각으로 겸용한다. 한 세션의 세 분석이 끝나기에 넉넉해야 한다 — 학생 30명이면 GMS 호출이
    # 30회이고 회당 최악 60초라 30분, 여기에 공통·강사 분석을 더한 값이다. 짧으면 살아 있는 실행의
    # 세션을 다른 실행이 가져가 같은 GMS 호출이 두 번 나가고, 길면 죽은 실행의 세션이 그만큼 묶인다.
    # 전체 마감은 8시간이라 한 번 잃어도 만회할 여지가 있다.
    lease-duration: ${POSTCLASS_ANALYSIS_LEASE_DURATION:PT60M}
    # 배경 디스패치 활성 여부. 테스트가 배경 폴링 없이 유스케이스를 직접 부를 수 있게 열어 둔다.
    enabled: ${POSTCLASS_ANALYSIS_ENABLED:true}

notification:
  email:
    # 리포트가 준비된(session_reports.published_at 설정) 세션의 학생에게 이메일을 보내는 릴레이의 활성 여부.
    # 켤 때는 SMTP 를 함께 설정한다: SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME /
    # SPRING_MAIL_PASSWORD (relaxed binding). 이 값들이 없으면 JavaMailSender 빈이 없어 발송이 실패로 기록·재시도된다.
    # 꺼져 있으면 등록·발송 스케줄러 자체가 등록되지 않는다.
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    # 등록 + 발송 릴레이 주기(ISO-8601 duration).
    relay-delay: ${NOTIFICATION_EMAIL_RELAY_DELAY:PT10S}
    # 학생에게 보이는 발신 주소.
    from: ${NOTIFICATION_EMAIL_FROM:no-reply@zani.app}
    # 이메일 로그인 링크의 앱 기본 주소. 링크는 {app-base-url}/sessions/{sessionId}/report 로 만든다.
    app-base-url: ${NOTIFICATION_APP_BASE_URL:https://zani.app}

gms:
  base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com}
  api-key: ${GMS_API_KEY:}
  mock-enabled: ${GMS_MOCK_ENABLED:true}
  read-timeout: ${GMS_READ_TIMEOUT:10s}
  connect-timeout: ${GMS_CONNECT_TIMEOUT:2s}
  stt-model: ${GMS_STT_MODEL:whisper-1}
  # 전사 전용 timeout. 재시도는 없다.
  # 실측: 300초 클립이 GMS 부하에 따라 14~31초. 기준 문서 §9의 10초는 300초 클립에서 거의 항상
  # 실패해 20초로 올렸다. 다만 실측 최대치(31초)까지 기다리지는 않는다 — 느린 응답을 끊는 쪽이
  # 낫다고 봤다. 팁을 보내지 않으면 쿨타임이 시작되지 않아(§10 "알림 1회 후 10분") 다음 트리거가
  # 부하가 덜한 시점에 다시 시도할 수 있고, 300초 전 발화에 40초 지연을 더한 팁은 강사에게
  # 효용이 떨어진다. 운영 데이터가 쌓이면 팀에서 재조정한다.
  transcribe-timeout: ${GMS_TRANSCRIBE_TIMEOUT:20s}
  transcribe-language: ${GMS_TRANSCRIBE_LANGUAGE:ko}
  # 사후 배치 전사 전용 timeout. 위의 transcribe-timeout(20s) 을 재사용하면 안 된다 — 그 값은 실시간
  # 코칭용이고 "느린 응답을 끊는 쪽이 낫다" 는 판단이 들어 있다. 배치는 반대로 기다려야 한다.
  # 실측 최악 비율(처리시간/오디오길이 0.198)을 10분 청크에 적용하면 약 119초다. 10분은 미실측이라
  # 여유를 두어 180초로 시작하고, timeout 이 나도 S15P11A105-107 의 재시도 정책을 그대로 쓴다.
  postclass-transcribe-timeout: ${GMS_POSTCLASS_TRANSCRIBE_TIMEOUT:180s}
  tip-model: ${GMS_TIP_MODEL:gpt-5.4-mini}
  # 팁 문구 전용 timeout. 실측에서 슬롯 1개 응답이 1.2~1.5초였다(프롬프트 100토큰 기준).
  # 전사 뒤에 붙는 단계라 여유를 크게 둘 이유가 없다.
  tip-timeout: ${GMS_TIP_TIMEOUT:6s}
  analysis-model: ${GMS_ANALYSIS_MODEL:gpt-5.4-mini}
  # 사후 분석 전용 timeout. 공통 분석(248)과 학생별 분석(249)이 함께 쓴다. 팁(6초)보다 크게 둔다 —
  # 팁은 개념 하나를 뽑는 100토큰 프롬프트지만, 공통 분석은 수업 전체 전사를 읽고 구간 목록과 요약을,
  # 학생별 분석은 요약 + 추천 5개 + 4지선다 5문항을 한 번에 만든다. 학생별 분석 실측은 8.4~10.1초였다.
  # 사후 배치라 지연에 여유가 있다(8시간 SLA).
  analysis-timeout: ${GMS_ANALYSIS_TIMEOUT:60s}
  # 리포트 질의응답 전용 timeout(259). 위의 analysis-timeout(60초)을 재사용하면 안 된다 — 그 값에는
  # "사후 배치라 지연에 여유가 있다" 는 판단이 들어 있는데, 이쪽은 사람이 채팅창을 열어 둔 채 기다린다.
  # 입력은 앵커 주변 전사와 목차뿐이고 출력은 답변 600자 + 인용 3개라 학생별 분석(실측 8.4~10.1초)보다
  # 가볍다. 오래 매달려 있느니 실패를 보여 주고 다시 누르게 하는 편이 낫다.
  assistant-timeout: ${GMS_ASSISTANT_TIMEOUT:25s}

report:
  assistant:
    # 답변 600자 + 인용 3개의 출력 상한. 잘리면 finish_reason=length 로 JSON 이 깨져, 사람이 25초를
    # 기다린 끝에 아무것도 받지 못한다. 한국어는 토큰당 1자 안팎이라 여유를 두어 1,500 으로 둔다.
    # 요청 바이트 임계는 설정으로 열지 않는다 — 근거는 content-analysis 와 같고 값은 코드에 있다.
    max-completion-tokens: ${REPORT_ASSISTANT_MAX_COMPLETION_TOKENS:1500}

coach:
  history-retry-delay: ${COACH_HISTORY_RETRY_DELAY:PT5S}
  tip:
    # 이 값에 못 미치는 슬롯은 팁을 만들지 않는다. 실제 응답 분포를 보고 조정한다.
    min-confidence: ${COACH_TIP_MIN_CONFIDENCE:0.5}
    # gpt-5.4-mini 는 max_tokens 를 거부하고 max_completion_tokens 를 요구한다(실측).
    # 실측 소비는 근거 구절(evidence)까지 받으면 50 토큰이다(없으면 25). reasoning 토큰은 쓰지
    # 않았다. 60 으로 두면 여유가 10 토큰뿐이라 잘릴 위험이 있어 관측치의 두 배로 둔다.
    max-completion-tokens: ${COACH_TIP_MAX_COMPLETION_TOKENS:100}
    # 프롬프트에 넣을 전사 마지막 N자 — window 한 번 분량의 상한이다.
    # 실측: 5분 강의 전사가 1,665자(5.5자/초)였다. 말이 빠른 강사(8~9자/초)면 300초에
    # 2,400~2,700자가 나오므로 3,000자면 온전히 들어간다. 더 낮추면 빠른 강사만 window 가
    # 조용히 줄어든다. 이 상한이 필요한 이유는 지연이 아니라(입력 1,500자와 3,331자 모두
    # 1.25초로 같았다) 최근성이다 — 입력을 늘리면 모델이 트리거 직전이 아닌 앞부분 개념을 골랐다.
    transcript-tail-chars: ${COACH_TIP_TRANSCRIPT_TAIL_CHARS:3000}
  pipeline:
    # 한 건이 전사 20초 + LLM 6초로 최대 26초 스레드를 점유한다. 오디오 버퍼가 동시에 들 수 있는
    # 세션이 8개라 실행 2 + 대기 6 으로 상한을 맞춘다.
    thread-count: ${COACH_PIPELINE_THREAD_COUNT:2}
    queue-capacity: ${COACH_PIPELINE_QUEUE_CAPACITY:6}
    # 트리거 시각부터 작업 시작까지 허용하는 지연. 이보다 밀리면 전사·GMS 를 호출하지 않는다 —
    # 지금 오디오를 떠도 트리거 당시가 아닌 발화가 섞인다. 10초는 attention 판정 한 주기이고
    # 300초 창의 약 3.3% 다. 링버퍼가 끝점 지정 스냅샷을 제공하면 이 상한이 필요 없어진다.
    max-trigger-delay: ${COACH_PIPELINE_MAX_TRIGGER_DELAY:PT10S}

attention:
  detector:
    # 서버가 해석할 수 있는 특징 추출 계약. 배포 계약은 확정 문서 §3.1 의 mediapipe_98_v1 이다.
    # 비워 두면 버전을 따지지 않는다(로컬·시연 편의). 추론 엔진 버전은 받지 않는다 — 티켓 61.
    supported-feature-schema-versions:
      - mediapipe_98_v1
  timeline:
    # 리포트 타임라인 계산 임계값. 적지 않은 값은 TimelinePolicy.defaults() 를 쓴다.
    # 아래 값들은 그 defaults() 와 같은 값을 다시 적은 것이다 — 코드만 보고는 조정 가능한지 알 수 없어
    # 여기 드러낸다. 기본값의 출처는 여전히 TimelinePolicy.defaults() 이고 TimelinePolicyTest 가 지킨다.
    # 세션 자동 종료 시각(Session.ACTIVE_DURATION)과 같은 값이다. 오프셋이 망가진 데이터에서 격자가
    # 무한히 늘어나는 것을 막는 안전장치다.
    max-duration: ${ATTENTION_TIMELINE_MAX_DURATION:PT3H}
    # 시계열 격자 간격. 이 간격마다 집단 신호 점을 하나 찍는다.
    sampling-interval: ${ATTENTION_TIMELINE_SAMPLING_INTERVAL:PT5S}
    # 집단 비율이 참고하는 관찰창(FRD §18.2 의 최근 5분).
    group-window: ${ATTENTION_TIMELINE_GROUP_WINDOW:PT5M}
    # 이만큼 이어서 접속해야 집계 대상이 된다. 실시간 경로와 값을 맞춰야 한다.
    required-connection: ${ATTENTION_TIMELINE_REQUIRED_CONNECTION:PT1M}
    # 측정 불가가 이만큼 이어지면 분모에서 뺀다.
    measurement-outage: ${ATTENTION_TIMELINE_MEASUREMENT_OUTAGE:PT1M}
    # 확정된 유의 상태가 유효하게 남는 기간(확정 문서 §7.3).
    significant-ttl: ${ATTENTION_TIMELINE_SIGNIFICANT_TTL:PT5M}
    # 참여 상태 UNMEASURABLE 을 확정하는 연속 관측 수.
    unmeasurable-run-length: ${ATTENTION_TIMELINE_UNMEASURABLE_RUN_LENGTH:3}
    # FRD §18.3 흐트러짐 구간 임계값. 원격 조정이 가능해야 한다는 요구사항 때문에 설정으로 뺀다.
    distraction-start-ratio: ${ATTENTION_TIMELINE_DISTRACTION_START_RATIO:0.30}
    distraction-start-hold: ${ATTENTION_TIMELINE_DISTRACTION_START_HOLD:PT20S}
    distraction-end-ratio: ${ATTENTION_TIMELINE_DISTRACTION_END_RATIO:0.20}
    distraction-end-hold: ${ATTENTION_TIMELINE_DISTRACTION_END_HOLD:PT30S}
    distraction-merge-gap: ${ATTENTION_TIMELINE_DISTRACTION_MERGE_GAP:PT15S}
    # 확정 문서 §6.2 의 상태 키 TTL 과 같은 값이다. 사후 재생이 실시간과 같은 순간에 같은 판단을 하려면
    # 두 값이 함께 움직여야 한다.
    connection-gap: ${ATTENTION_TIMELINE_CONNECTION_GAP:PT30S}
    # 집중 흐름 칸 크기와 70% 게이트. 칸은 겹치지 않으며 이동창이 아니다(설계 문서 §2.8·§2.9).
    # 게이트가 빡빡해 실측에서 공백이 과하게 많으면 여기를 조정한다. connection-gap 과 값이 같지만
    # 뜻이 다르므로 함께 움직이지 않는다.
    focus-bucket: ${ATTENTION_TIMELINE_FOCUS_BUCKET:PT30S}
    focus-coverage-floor: ${ATTENTION_TIMELINE_FOCUS_COVERAGE_FLOOR:0.7}
    # 집계 대상 최소 인원. 이 수 미만인 칸은 집단 값을 감춘다(NFR-SEC-007 · REPORT-I-005). 기본값 5 가
    # 운영 기준이며, 참가자가 5명을 못 넘는 시연 세션에서만 낮춘다 — 그런 세션은 지금 전 구간이 비어
    # 강사 화면에 그래프가 없는 것처럼 보인다. 1 로 두면 한 학생의 값이 그대로 집단 평균이 되어
    # 익명성이 사라진다(REPORT-I-002).
    minimum-eligible: ${ATTENTION_TIMELINE_MINIMUM_ELIGIBLE:5}

coaching-trigger:
  # 최근 5분 유의 학생 비율의 하한. 이 값 이상이면 트리거한다(확정 문서 §7).
  threshold: ${COACHING_TRIGGER_THRESHOLD:0.30}
  # 트리거를 연 시각부터 다음 트리거를 막는 기간. 팁 유형과 무관한 단일 글로벌 쿨타임이다.
  cooldown: ${COACHING_TRIGGER_COOLDOWN:PT10M}
  # 확보된 강사 오디오가 이보다 짧으면 트리거하지 않는다. 이 경우에만 쿨타임을 시작하지 않는다.
  minimum-audio: ${COACHING_TRIGGER_MINIMUM_AUDIO:PT1M}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  environment: ${LIVEKIT_ENVIRONMENT:local}
  token-ttl: ${LIVEKIT_TOKEN_TTL:PT10M}

audio-clip:
  # 강사 마이크 링버퍼가 유지하는 최근 구간. 서버 메모리에만 두고 저장하지 않는다.
  window: ${AUDIO_CLIP_WINDOW:PT5M}
  # 이보다 짧게 확보됐으면 전사를 시도하지 않는다(수업 시작 직후 등).
  min-transcribable: ${AUDIO_CLIP_MIN_TRANSCRIBABLE:PT1M}
  # Egress WebSocket 출력의 샘플레이트(s16le 모노). LiveKit은 들어오는 트랙을 따르며 보통 48kHz다.
  sample-rate: ${AUDIO_CLIP_SAMPLE_RATE:48000}
  # 버퍼를 동시에 들 수 있는 세션 수. 상한이 없으면 OOM으로 진행 중인 모든 강의가 끊긴다.
  max-sessions: ${AUDIO_CLIP_MAX_SESSIONS:8}
  # Egress가 오디오를 밀어 넣을 주소. Egress가 host 네트워크라 기본값(루프백)으로 도달한다.
  # 접속 자격은 서버가 기동 시 만들어 덧붙이므로 설정할 값이 없다.
  stream-url-template: ${AUDIO_CLIP_STREAM_URL_TEMPLATE:ws://127.0.0.1:18080/internal/audio/{sessionId}}

recording:
  # Egress 노드(EC2)의 로컬 저장 루트. S3는 사용하지 않는다(가이드 §14).
  base-path: ${RECORDING_BASE_PATH:/srv/zani/recordings}
  # 최종 MP4 를 읽어서 서빙할 마운트 경로. base-path 와 값이 같아도 뜻이 다르다 — 배포에서 두 마운트가
  # 갈린다(RecordingProperties 참고).
  media-root: ${RECORDING_MEDIA_ROOT:/srv/zani/recordings}
  # 발급한 접근 주소의 유효 기간. 짧을수록 새어 나간 주소의 수명이 짧다.
  media-url-ttl: ${RECORDING_MEDIA_URL_TTL:PT5M}
  # 발급할 주소의 형식. {sessionId} 를 치환한다. 기본값은 로컬 주소이므로 배포에서는 반드시 덮어야
  # 한다 — 이 값이 이메일 링크로 그대로 나가 티켓 311 이 났다.
  media-url-template: ${RECORDING_MEDIA_URL_TEMPLATE:http://localhost:18080/api/v1/sessions/{sessionId}/media}
  # 운영에서는 항상 활성화한다. 수동 relay를 검증하는 통합 테스트만 false로 격리한다.
  outbox-relay-enabled: ${RECORDING_OUTBOX_RELAY_ENABLED:true}
  # outbox 릴레이 주기(ISO-8601 duration).
  outbox-relay-delay: ${RECORDING_OUTBOX_RELAY_DELAY:PT5S}
  finalization:
    # Track Egress 원본은 읽기 전용, manifest·MP4는 별도의 읽기/쓰기 마운트로 분리한다.
    source-root: ${RECORDING_FINALIZATION_SOURCE_ROOT:/out}
    output-root: ${RECORDING_FINALIZATION_OUTPUT_ROOT:/finalized}
    worker-path: ${RECORDING_FINALIZATION_WORKER_PATH:/app/media/finalize-recording.sh}
    # 최대 3시간 수업을 보수적으로 허용하되 timeout 시 자식 ffmpeg까지 강제 종료한다.
    process-timeout: ${RECORDING_FINALIZATION_PROCESS_TIMEOUT:PT4H}
    dispatch:
      enabled: ${RECORDING_FINALIZATION_ENABLED:true}
      poll-delay: ${RECORDING_FINALIZATION_POLL_DELAY:PT15S}
      batch-size: ${RECORDING_FINALIZATION_BATCH_SIZE:5}
      # 최대 4시간 프로세스 제한보다 길어야 살아 있는 worker의 실행권을 회수하지 않는다.
      lease-duration: ${RECORDING_FINALIZATION_LEASE_DURATION:PT5H}
      waiting-delay: ${RECORDING_FINALIZATION_WAITING_DELAY:PT15S}
      retry-delay: ${RECORDING_FINALIZATION_RETRY_DELAY:PT1M}
      max-attempts: ${RECORDING_FINALIZATION_MAX_ATTEMPTS:3}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    # 시연용 목업 데이터(db/seed/R__demo_seed.sql)를 함께 적용한다. prod 는 붙이지 않는다.
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/zani}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  secret: ${LOCAL_JWT_SECRET:zani-local-jwt-secret-key-must-be-at-least-thirty-two-bytes}

auth:
  cookie:
    secure: false
    same-site: Lax

cors:
  allowed-origins:
    - ${LOCAL_FRONTEND_ORIGIN:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # 시연용 목업 데이터(db/seed/R__demo_seed.sql)를 함께 적용한다. prod 는 붙이지 않는다.
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:None}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}

gms:
  mock-enabled: ${GMS_MOCK_ENABLED:false}
