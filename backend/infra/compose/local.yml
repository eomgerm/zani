name: zani-local

services:
  mysql:
    image: mysql:9.7.1@sha256:cbade841779f1661300e705721f9d2ff159865cc7a8a291affbff43ac6ec7f1d
    container_name: zani-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:-root}
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-zani}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}"
          mysqladmin ping -h 127.0.0.1 -u root --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    container_name: zani-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql-data:
    name: zani-local-mysql-data
  redis-data:
    name: zani-local-redis-data
