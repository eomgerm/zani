# Include these locations in the existing TLS server block for i15a105.p.ssafy.io.
#
# The server block must also enable HTTP/2: `listen 443 ssl http2;` (or `http2 on;`
# on nginx >= 1.25.1). Over HTTP/1.1 the browser queues the my-lectures thumbnail
# requests behind its per-host connection cap (Lighthouse "Modern HTTP", est. 790 ms).
# WebSocket upgrades (/ws and LiveKit signaling) negotiate HTTP/1.1 per connection
# regardless, so h2 does not affect them. Apply with `nginx -t` before reload, then
# verify: `curl -sIo /dev/null -w '%{http_version}\n' https://i15a105.p.ssafy.io/`
# prints `2`.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# STOMP WebSocket handshake for session chat, hand raise, and reactions (backend /ws endpoint).
# The /api/ block cannot serve this: a plain proxy does not forward the Upgrade handshake.
#
# The broker sends STOMP heartbeats every 25s (StompConfig), so an idle connection is never
# actually silent here. The timeouts are the backstop for a stalled heartbeat scheduler: they
# must exceed the 3-hour maximum lesson, otherwise a quiet lesson is cut mid-session.
location = /ws {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
}

location ^~ /swagger-ui/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /swagger-ui.html {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /v3/api-docs {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
