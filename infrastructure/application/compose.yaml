name: zani-application

services:
  mysql:
    image: mysql:8.4.10
    container_name: zani-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zani
      MYSQL_USER: zani
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Seoul
    secrets:
      - mysql_app_password
      - mysql_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - application-internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -u root
          --password="$$(cat /run/secrets/mysql_root_password)" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis-app:
    image: redis@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    container_name: zani-redis-app
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        exec /usr/bin/setpriv --reuid redis --regid redis --clear-groups
        redis-server --appendonly yes
        --requirepass "$$(cat /run/secrets/redis_app_password)"
    secrets:
      - redis_app_password
    volumes:
      - redis-app-data:/data
    networks:
      - application-internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning
          -a "$$(cat /run/secrets/redis_app_password)" ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-zani/backend:dev}
    container_name: zani-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/zani?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: zani
      REDIS_HOST: redis-app
      REDIS_PORT: "6379"
      REDIS_SSL_ENABLED: "false"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID is required}
      AUTH_COOKIE_SAME_SITE: None
      GMS_MOCK_ENABLED: "${GMS_MOCK_ENABLED:-false}"
      COACHING_TRIGGER_COOLDOWN: "${COACHING_TRIGGER_COOLDOWN:-PT10M}"
      COACHING_TRIGGER_THRESHOLD: "${COACHING_TRIGGER_THRESHOLD:-0.30}"
      # 참여도 타임라인 집계 게이트(S15P11A105-315 가 설정으로 노출한 값들). 여기 나열하지 않으면
      # runtime.env 에 값을 넣어도 컨테이너에 닿지 않고 코드 기본값만 쓰인다. 참가자가 최소 인원을
      # 못 넘는 시연 세션은 집단 값이 전 구간 감춰져 강사 화면에 그래프가 없는 것처럼 보이는데,
      # 그때 되돌릴 수 있어야 한다. 기본값은 application.yaml 과 같아야 한다 — 갈라지면 "어느 쪽이
      # 실제 값인가" 를 확인할 방법이 없다.
      ATTENTION_TIMELINE_MINIMUM_ELIGIBLE: "${ATTENTION_TIMELINE_MINIMUM_ELIGIBLE:-5}"
      ATTENTION_TIMELINE_FOCUS_COVERAGE_FLOOR: "${ATTENTION_TIMELINE_FOCUS_COVERAGE_FLOOR:-0.7}"
      ATTENTION_TIMELINE_REQUIRED_CONNECTION: "${ATTENTION_TIMELINE_REQUIRED_CONNECTION:-PT1M}"
      # 브라우저가 접속할 LiveKit 주소. 이 값이 media-token 응답으로 그대로 내려간다.
      # 7880은 UFW로 막혀 있고 nginx가 443에서 프록시하므로 공개 URL을 쓴다.
      LIVEKIT_URL: wss://i15a105.p.ssafy.io
      # room 이름 zani-{env}-session-{id}의 일부. 토큰 발급과 Egress가 같은 값을 써야 한다.
      LIVEKIT_ENVIRONMENT: dev
      # Egress 컨테이너의 마운트 경로(/srv/zani/recordings/track-egress -> /out).
      # 기본값은 Egress 컨테이너 안에 없는 경로라 지정하지 않으면 녹화 파일이 남지 않는다.
      RECORDING_BASE_PATH: /out
      # 사후 전사가 원본 OGG 를 읽을 루트. RECORDING_BASE_PATH 와 값이 같지만 뜻이 다르다 — 그쪽은
      # "LiveKit 에 넘길 Egress 출력 경로"이고 이쪽은 "우리가 읽을 마운트 경로"다. 하나로 겸하면 두
      # 마운트가 갈리는 날 조용히 깨진다(S15P11A105-95).
      POSTCLASS_SOURCE_ROOT: /out
      # 무음 환각 세그먼트 필터(S15P11A105-306). 기본 ON 인 휴리스틱이라 운영에서 되돌릴 수 있어야 한다 —
      # 여기 나열하지 않으면 runtime.env 에 값을 넣어도 컨테이너에 닿지 않고 코드 기본값만 쓰인다.
      # 기본값은 application.yaml 과 같아야 한다. 갈라지면 "어느 쪽이 실제 값인가" 를 확인할 방법이 없다.
      POSTCLASS_TRANSCRIPTION_HALLUCINATION_FILTER_ENABLED: "${POSTCLASS_TRANSCRIPTION_HALLUCINATION_FILTER_ENABLED:-true}"
      POSTCLASS_TRANSCRIPTION_NO_SPEECH_THRESHOLD: "${POSTCLASS_TRANSCRIPTION_NO_SPEECH_THRESHOLD:-0.8}"
      POSTCLASS_TRANSCRIPTION_REPEATED_PHRASE_FILTER_ENABLED: "${POSTCLASS_TRANSCRIPTION_REPEATED_PHRASE_FILTER_ENABLED:-true}"
      # 최종 녹화 manifest 와 lecture.mp4 를 생성하는 writable 루트. Track Egress 원본(/out)은
      # 계속 read-only 이며 worker lock 과 partial 산출물도 이 경로 아래에만 둔다.
      RECORDING_FINALIZATION_SOURCE_ROOT: /out
      RECORDING_FINALIZATION_OUTPUT_ROOT: /finalized
      RECORDING_FINALIZATION_WORKER_PATH: /app/media/finalize-recording.sh
      # 117 재생 API가 최종 lecture.mp4 를 읽는 별칭. 인증·Range 처리는 117이 소유한다.
      RECORDING_MEDIA_ROOT: /recordings
      RECORDING_MEDIA_URL_TEMPLATE: "${RECORDING_MEDIA_URL_TEMPLATE:-https://i15a105.p.ssafy.io/api/v1/sessions/{sessionId}/media}"
      RECORDING_THUMBNAIL_URL_TEMPLATE: "${RECORDING_THUMBNAIL_URL_TEMPLATE:-https://i15a105.p.ssafy.io/api/v1/sessions/{sessionId}/thumbnail}"
      NOTIFICATION_EMAIL_ENABLED: "${NOTIFICATION_EMAIL_ENABLED:-false}"
      NOTIFICATION_EMAIL_FROM: "${NOTIFICATION_EMAIL_FROM:-}"
      NOTIFICATION_APP_BASE_URL: "${NOTIFICATION_APP_BASE_URL:-https://i15a105.p.ssafy.io}"
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-587}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}"
    volumes:
      # Track Egress 원본을 사후 전사가 읽는다. 쓰기는 Egress 만 하므로 read-only 로 붙인다.
      # 호스트 track-egress 는 0771 root:root 여야 한다 — owner/group 의 rwx 는 Egress 쓰기용이고,
      # other 의 x 는 이 컨테이너(UID 10001)가 경로를 통과하기 위한 것이다. o+r 은 주지 않는다:
      # 파일 경로의 정본은 DB recording_files.storage_key 라 /out 을 나열할 일이 없다.
      # 준비 절차는 infrastructure/application/README.md 의 Required host directories 를 따른다.
      - /srv/zani/recordings/track-egress:/out:ro
      # 269만 manifest·lock·partial·최종 MP4 를 쓴다. Egress 원본은 별도 /out:ro 로 읽는다.
      - /srv/zani/recordings:/finalized:rw
      # The writable parent also contains Track Egress sources; mask that child read-only at its second alias.
      - /srv/zani/recordings/track-egress:/finalized/track-egress:ro
      # 117 재생 경로는 동일 호스트 파일을 읽기 전용 별칭으로 본다.
      - /srv/zani/recordings:/recordings:ro
    secrets:
      - mysql_app_password
      - redis_app_password
      - jwt_secret
      - livekit_api_key
      - livekit_api_secret
      - gms_api_key
      - smtp_password
    ports:
      - 127.0.0.1:18080:8080
    networks:
      - application-internal
    depends_on:
      mysql:
        condition: service_healthy
      redis-app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  application-internal:
    name: zani-application-internal

volumes:
  mysql-data:
    name: zani-mysql-data
  redis-app-data:
    name: zani-redis-app-data

secrets:
  mysql_root_password:
    file: /etc/zani/application/secrets/mysql_root_password
  mysql_app_password:
    file: /etc/zani/application/secrets/mysql_app_password
  redis_app_password:
    file: /etc/zani/application/secrets/redis_app_password
  jwt_secret:
    file: /etc/zani/application/secrets/jwt_secret
  livekit_api_key:
    file: /etc/zani/application/secrets/livekit_api_key
  livekit_api_secret:
    file: /etc/zani/application/secrets/livekit_api_secret
  gms_api_key:
    file: /etc/zani/application/secrets/gms_api_key
  smtp_password:
    file: ${SMTP_PASSWORD_FILE:-/etc/zani/application/secrets/smtp_password}
